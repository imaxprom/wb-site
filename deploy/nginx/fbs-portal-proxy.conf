# Dedicated warehouse portal. TLS terminates on the Proxmox reverse-proxy LXC;
# application authorization and host isolation are enforced by Next.js.
server {
    listen 80;
    server_name fbs.imaxprom.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name fbs.imaxprom.site;

    ssl_certificate /etc/letsencrypt/live/fbs.imaxprom.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fbs.imaxprom.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://192.168.55.104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
